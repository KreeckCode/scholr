<script>
// Update cart count on page load and after cart operations
document.addEventListener('DOMContentLoaded', function() {
    updateCartCount();
});

function updateCartCount() {
    fetch('/courses/cart/')
        .then(response => response.text())
        .then(html => {
            // Parse the HTML to extract cart count
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const cartItems = doc.querySelectorAll('.cart-item');
            const count = cartItems.length;
            
            // Update all cart count badges
            const badges = document.querySelectorAll('#cart-count, .cart-count');
            badges.forEach(badge => {
                badge.textContent = count;
                badge.style.display = count > 0 ? 'inline-flex' : 'none';
            });
        })
        .catch(error => console.log('Could not update cart count'));
}

// Listen for custom cart update events
document.addEventListener('cartUpdated', updateCartCount);
</script>

<nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4" aria-label="Breadcrumb">
    <ol class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
        <li>
            <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}/{% endif %}"
               class="transition-colors" style="color: var(--snap-muted);"
               aria-label="{% if user.is_authenticated %}Dashboard{% else %}Home{% endif %}">
                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
            </a>
        </li>
        {% for crumb in breadcrumbs %}
        <li class="flex items-center gap-2">
            <svg class="h-4 w-4 shrink-0" style="color: var(--snap-line);" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
            </svg>
            {% if crumb.url and not forloop.last %}
            <a href="{{ crumb.url }}" class="hover:underline" style="color: var(--snap-slate);">{{ crumb.label }}</a>
            {% else %}
            <span class="font-medium" style="color: var(--snap-navy);" aria-current="page">{{ crumb.label }}</span>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>

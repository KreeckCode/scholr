{# Reusable pill nav link. Params: url, label, active_paths #}
<a href="{% url url %}"
   class="rounded-full px-4 py-2 text-sm font-medium transition-all duration-200
          {% if active_paths in request.path or request.resolver_match.url_name == url %}
              bg-blue-50 text-blue-700 ring-1 ring-blue-600/10
          {% else %}
              text-slate-600 hover:bg-slate-100 hover:text-slate-900
          {% endif %}">
    {{ label }}
</a>

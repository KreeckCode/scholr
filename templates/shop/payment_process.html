{% extends 'shop/base/_base.html' %}
{% load shop_tags %}

{% block title %}Processing Payment - scholr{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="glass-card rounded-2xl p-8 text-center">
        <div id="payment-status">
            <div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-dark rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Processing Payment...</h2>
            <p class="text-gray-600 mb-6">Please wait while we redirect you to secure payment</p>
        </div>
    </div>
</div>

<!-- Paystack Integration -->
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
    const paystack = PaystackPop.setup({
        key: '{{ paystack_public_key }}',
        email: '{{ email }}',
        amount: {{ amount_kobo }},
        currency: 'ZAR',
        ref: '{{ payment_reference }}',
        metadata: {
            order_number: '{{ order.order_number }}',
            custom_fields: [
                {
                    display_name: "Order Number",
                    variable_name: "order_number",
                    value: "{{ order.order_number }}"
                }
            ]
        },
        callback: function(response) {
            // Payment successful
            window.location.href = '{{ callback_url }}?reference=' + response.reference;
        },
        onClose: function() {
            // User closed payment window
            document.getElementById('payment-status').innerHTML = `
                <svg class="w-16 h-16 text-yellow-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Payment Cancelled</h2>
                <p class="text-gray-600 mb-6">You closed the payment window</p>
                <a href="{% url 'shop:payment' order.order_number %}" 
                   class="inline-block px-6 py-3 btn-primary text-white font-medium rounded-lg transition-smooth">
                    Try Again
                </a>
            `;
        }
    });
    
    // Auto-open payment modal
    paystack.openIframe();
</script>
{% endblock %}

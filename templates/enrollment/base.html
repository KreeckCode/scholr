<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Enrollment{% endblock %} — {{ school_name|default:"Scholr" }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
body { background-color: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; }
.field {
    width: 100%;
    background: rgba(15,23,42,0.8);
    border: 1px solid rgba(71,85,105,0.7);
    border-radius: 0.75rem;
    padding: 0.7rem 1rem;
    color: #e2e8f0;
    font-size: 0.875rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
}
.field:focus {
    border-color: rgba(99,102,241,0.7);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}
.field::placeholder { color: #475569; }
select.field option { background: #0f172a; color: #e2e8f0; }
.glass {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.07);
}
.hero-grid {
    background-image: radial-gradient(circle at 1px 1px, rgba(99,102,241,0.15) 1px, transparent 0);
    background-size: 32px 32px;
}
.label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.375rem; }
.field-error { font-size: 0.75rem; color: #f87171; margin-top: 0.25rem; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">

<!-- Minimal header -->
<header class="border-b border-slate-800/60 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex h-14 items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-white font-bold text-sm">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
            </div>
            Scholr Enrollment
        </a>
        <a href="{% url 'enrollment:status' %}"
           class="text-xs text-slate-400 hover:text-slate-200 transition-colors">
            Check application status →
        </a>
    </div>
</header>

{% if messages %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 pt-4 space-y-2">
    {% for message in messages %}
    <div class="flex items-start gap-3 px-4 py-3 rounded-xl border text-sm
        {% if message.tags == 'error' %}bg-red-950/60 border-red-800/60 text-red-300
        {% elif message.tags == 'success' %}bg-green-950/60 border-green-800/60 text-green-300
        {% else %}bg-blue-950/60 border-blue-800/60 text-blue-300{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}

<main>
{% block content %}{% endblock %}
</main>

<footer class="border-t border-slate-800/40 mt-20 py-8 text-center text-xs text-slate-600">
    <p>Powered by Scholr &mdash; Enrollment Portal</p>
    <p class="mt-1">Need help? Contact the school directly.</p>
</footer>
</body>
</html>

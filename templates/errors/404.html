<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page not found — SNAP Uplift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --navy:        #0E1B33;
        --navy-deep:   #08111F;
        --panel:       #16233F;
        --teal:        #12A594;
        --teal-bright: #16C2AE;
        --orange:      #F26A21;
        --slate:       #93A2B7;
        --muted:       #56657C;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--navy-deep);
        color: var(--slate);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
    }

    .glow {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(90vw, 700px);
        height: min(90vw, 700px);
        transform: translate(-50%, -55%);
        background: radial-gradient(circle, rgba(18,165,148,0.13) 0%, transparent 62%);
        pointer-events: none;
    }

    .wrap {
        position: relative;
        width: 100%;
        max-width: 30rem;
        text-align: center;
    }

    .panels {
        display: flex;
        justify-content: center;
        gap: 0.65rem;
        margin-bottom: 2.25rem;
    }

    .panel {
        width: 4.75rem;
        height: 6rem;
        border-radius: 0.9rem;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.07);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', system-ui, sans-serif;
        font-size: 2.9rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.03em;
        box-shadow: 0 18px 40px -26px rgba(0,0,0,0.9);
        animation: drop 0.62s cubic-bezier(0.22, 1.2, 0.36, 1) both;
    }

    .panel:nth-child(1) { animation-delay: 0.05s; }
    .panel:nth-child(2) { animation-delay: 0.17s; }
    .panel:nth-child(3) { animation-delay: 0.29s; }

    .panel-gap {
        background: transparent;
        border: 1px dashed rgba(242,106,33,0.45);
        color: rgba(242,106,33,0.85);
        box-shadow: none;
        animation: drop 0.62s cubic-bezier(0.22, 1.2, 0.36, 1) 0.17s both,
                   waver 3.6s ease-in-out 1s infinite;
    }

    @keyframes drop {
        from { opacity: 0; transform: translateY(-2.25rem) rotate(-5deg); }
        to   { opacity: 1; transform: translateY(0) rotate(0); }
    }

    @keyframes waver {
        0%, 100% { transform: translateY(0) rotate(0); }
        50%      { transform: translateY(-5px) rotate(-2.2deg); }
    }

    .rule {
        width: 3.5rem;
        height: 3px;
        margin: 0 auto 1.75rem;
        border-radius: 2px;
        background: var(--orange);
        transform: scaleX(0);
        transform-origin: center;
        animation: draw 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.55s both;
    }

    @keyframes draw {
        to { transform: scaleX(1); }
    }

    h1 {
        font-family: 'Poppins', system-ui, sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        margin: 0 0 0.85rem;
    }

    p.lead {
        font-size: 0.98rem;
        line-height: 1.65;
        margin: 0 0 2.25rem;
    }

    .rise {
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .rise-1 { animation-delay: 0.62s; }
    .rise-2 { animation-delay: 0.72s; }
    .rise-3 { animation-delay: 0.82s; }

    @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.7rem;
        margin-bottom: 2.5rem;
    }

    .btn {
        font-family: 'Poppins', system-ui, sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.85rem;
        text-decoration: none;
        border: 1px solid transparent;
        transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .btn-teal {
        background: var(--teal);
        color: #fff;
    }
    .btn-teal:hover {
        background: var(--teal-bright);
        transform: translateY(-1px);
        box-shadow: 0 12px 26px -14px rgba(18,165,148,0.95);
    }

    .btn-ghost {
        border-color: rgba(255,255,255,0.18);
        color: #C4CEDB;
        background: transparent;
    }
    .btn-ghost:hover {
        border-color: rgba(255,255,255,0.42);
        background: rgba(255,255,255,0.05);
        transform: translateY(-1px);
    }

    .links {
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.4rem;
    }

    .links a {
        font-size: 0.82rem;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.18s;
    }
    .links a:hover { color: var(--teal-bright); }

    a:focus-visible, .btn:focus-visible {
        outline: 3px solid var(--teal-bright);
        outline-offset: 3px;
    }

    @media (max-width: 420px) {
        .panel { width: 4rem; height: 5.2rem; font-size: 2.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
        .panel, .panel-gap, .rule, .rise {
            animation: none;
            opacity: 1;
            transform: none;
        }
        .btn:hover { transform: none; }
    }
</style>
</head>
<body>

<div class="glow"></div>

<div class="wrap">

    <div class="panels">
        <div class="panel">4</div>
        <div class="panel panel-gap">0</div>
        <div class="panel">4</div>
    </div>

    <div class="rule"></div>

    <h1 class="rise rise-1">This page is not here</h1>

    <p class="lead rise rise-2">
        The link may be old, or the page may have moved. Nothing is broken on your side.
    </p>

    <div class="actions rise rise-3">
        <a href="/" class="btn btn-teal">Go to the home page</a>
        <a href="#" class="btn btn-ghost" id="backLink">Back to the last page</a>
    </div>

    <div class="links rise rise-3">
        <a href="/courses/">Browse courses</a>
        <a href="mailto:info@judeaharvest.co.za">Report a broken link</a>
    </div>

</div>

<script>
(function () {
    var back = document.getElementById('backLink');
    if (!back) { return; }

    if (window.history.length > 1) {
        back.addEventListener('click', function (event) {
            event.preventDefault();
            window.history.back();
        });
    } else {
        back.parentNode.removeChild(back);
    }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found · Scholr</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-8"
      style="background-image:radial-gradient(circle at 1px 1px,rgba(99,102,241,0.12) 1px,transparent 0);background-size:32px 32px;">
    <div class="max-w-md w-full text-center">
        <p class="text-8xl font-black text-indigo-500/20 mb-4 tracking-tighter">404</p>
        <h1 class="text-2xl font-bold text-white mb-3">Page not found</h1>
        <p class="text-slate-400 mb-8">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="flex flex-wrap justify-center gap-3">
            <a href="/" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-colors">
                Go home
            </a>
            <a href="javascript:history.back()" class="px-5 py-2.5 border border-slate-700 text-slate-300 font-semibold rounded-xl hover:border-slate-500 transition-colors">
                Go back
            </a>
        </div>
    </div>
</body>
</html>

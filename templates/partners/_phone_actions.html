{% load i18n %}
{% load partners_tags %}{% if phone or email %}<p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs">{% if phone %}<a class="p-link" href="tel:{{ phone }}">{{ phone }}</a>{% with chat=phone|whatsapp_url %}{% if chat %}<a class="p-link" href="{{ chat }}" target="_blank" rel="noopener">{% translate "WhatsApp" %}</a>{% endif %}{% endwith %}{% endif %}{% if email %}<a class="p-link break-all" href="mailto:{{ email }}">{{ email }}</a>{% endif %}</p>{% endif %}

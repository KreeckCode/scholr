{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="{{ brand.theme_color }}">
    <title>Offline registers &mdash; {{ brand.name }}</title>
    <link rel="manifest" href="{% url 'partners:manifest' %}">
    <link rel="icon" href="{% static 'partners/icon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'partners/offline.css' %}">
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-900 antialiased">
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3">
            <a href="#/" class="flex items-center gap-2.5">
                <img src="{% static 'partners/icon.svg' %}" alt="" class="h-8 w-8">
                <span class="font-display text-sm font-semibold text-slate-900">{{ brand.name }} <span class="font-normal text-slate-500">offline</span></span>
            </a>
            <a href="{% url 'partners:portal_home' %}" class="text-sm font-medium text-teal-700">Portal</a>
        </div>
        <div id="status" class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 pb-2.5 text-xs text-slate-700" aria-live="polite"></div>
    </header>

    <main id="app" class="mx-auto max-w-3xl px-4 py-6">
        <p class="text-sm text-slate-500">Loading...</p>
    </main>

    <noscript><p class="mx-auto max-w-3xl px-4 text-sm text-red-700">The offline register needs JavaScript.</p></noscript>

    {{ config|json_script:"offline-config" }}
    <script src="{% static 'partners/offline-core.js' %}"></script>
    <script src="{% static 'partners/offline-app.js' %}"></script>
</body>
</html>

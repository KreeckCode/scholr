{% if activation %}
<div class="p-alert p-alert-warn" x-data="{ copied: false }">
    <p class="p-alert-title">{{ activation.label }}</p>
    <p class="mt-1">Send this link to the person by WhatsApp or SMS. It works once, and this is the only time it is shown.</p>
    <div class="mt-3 flex flex-col gap-2 sm:flex-row">
        <input type="text" readonly value="{{ activation.url }}" x-ref="link" aria-label="Set-password link"
               class="p-input-mono block w-full" @focus="$event.target.select()">
        <button type="button" class="p-btn-ghost shrink-0"
                @click="navigator.clipboard.writeText($refs.link.value).then(() => { copied = true; setTimeout(() => copied = false, 2000) })">
            <span x-show="!copied">Copy link</span><span x-show="copied" x-cloak>Copied</span>
        </button>
    </div>
</div>
{% endif %}

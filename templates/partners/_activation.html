{% if activation %}
<div class="mb-6 rounded-2xl border border-amber-200 bg-amber-50 p-5" x-data="{ copied: false }">
    <p class="text-sm font-semibold text-amber-900">{{ activation.label }}</p>
    <p class="mt-1 text-sm text-amber-900/80">Send this link to the person by WhatsApp or SMS. It works once, and this is the only time it is shown.</p>
    <div class="mt-3 flex flex-col gap-2 sm:flex-row">
        <input type="text" readonly value="{{ activation.url }}" x-ref="link" aria-label="Set-password link"
               class="block w-full rounded-xl border border-amber-200 bg-white px-3 py-2 font-mono text-xs text-slate-800">
        <button type="button" class="p-btn-ghost p-btn-sm shrink-0"
                @click="navigator.clipboard.writeText($refs.link.value).then(() => { copied = true; setTimeout(() => copied = false, 2000) })">
            <span x-show="!copied">Copy link</span><span x-show="copied" x-cloak>Copied</span>
        </button>
    </div>
</div>
{% endif %}

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - judea
          - metp
      skip_migrations:
        description: 'Skip migrations (code-only deploy)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.13'

# ============================================================
# STAGE 1 — CODE QUALITY & SECURITY
# Runs on every push and PR. Blocks deployment on failure.
# ============================================================
jobs:
  lint:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install quality tools
        run: pip install flake8 bandit

      # Only catch real errors (syntax, undefined names) — not style opinions.
      - name: Check for syntax errors and undefined names
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --exclude=venv,migrations,staticfiles,media \
            --show-source \
            --statistics

      - name: Security scan (bandit)
        run: |
          bandit -r . \
            --exclude=./venv,./staticfiles,./media \
            --severity-level high \
            --confidence-level high \
            -q

  # ============================================================
  # STAGE 2 — DJANGO CHECKS & TEST SUITE
  # Spins up real PostgreSQL + Redis via Docker services.
  # ============================================================
  test:
    name: Django Checks & Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholr
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: scholr_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-only-secret-key-never-used-in-production
      DEBUG: 'True'
      DATABASE_URL: postgresql://scholr:ci_password@localhost/scholr_ci
      REDIS_URL: redis://localhost:6379
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      SITE_PROFILE: metp
      SCHOLR_LMS_ENABLED: 'True'
      SCHOLR_ACADEMICS_ENABLED: 'True'
      SCHOLR_ENROLLMENT_ENABLED: 'False'
      SCHOLR_BURSARY_ENABLED: 'False'
      SCHOLR_BRIDGE_ENABLED: 'False'
      SCHOLR_PARTNERS_ENABLED: 'True'
      PARTNERS_PRIVATE_ROOT: /tmp/scholr_private
      MOODLE_URL: http://localhost/mylearn
      MOODLE_WS_TOKEN: dummy
      STATIC_ROOT: /tmp/scholr_static
      MEDIA_ROOT: /tmp/scholr_media

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Django's file log handler needs this to exist before setup runs
      - name: Create writable directories
        run: mkdir -p logs /tmp/scholr_private /tmp/scholr_static /tmp/scholr_media

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      # Each deployment runs a different profile, so all of them must load
      - name: Validate every site profile
        run: |
          for profile in snap metp school; do
            echo "Checking profile: ${profile}"
            SITE_PROFILE=${profile} python manage.py check
          done

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  # ============================================================
  # STAGE 3 — RESOLVE TARGETS
  # Turns the dropdown choice into a matrix. Push to main hits both.
  # ============================================================
  resolve:
    name: Resolve deploy targets
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    outputs:
      targets: ${{ steps.pick.outputs.targets }}

    steps:
      - name: Pick targets
        id: pick
        run: |
          CHOICE="${{ github.event.inputs.target || 'both' }}"
          case "${CHOICE}" in
            judea) TARGETS='["judea"]' ;;
            metp)  TARGETS='["metp"]' ;;
            *)     TARGETS='["judea","metp"]' ;;
          esac
          echo "targets=${TARGETS}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${TARGETS}"

  # ============================================================
  # STAGE 4 — DEPLOY
  # One job per target, running in parallel. Each has its own
  # concurrency group so two runs never race on the same box.
  # Automatic git rollback on any failure.
  # ============================================================
  deploy:
    name: Deploy to ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}

    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ matrix.target == 'judea' && secrets.JUDEA_SSH_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SKIP_MIGRATIONS,DEPLOY_DOMAIN,DEPLOY_TARGET
          script: |
            set -e
            cd /var/www/scholr

            # ── Record current state for rollback ──────────────────────────
            ROLLBACK_COMMIT=$(git rev-parse HEAD)
            echo "Current commit (rollback target): $ROLLBACK_COMMIT"

            # ── Rollback function ──────────────────────────────────────────
            # Called automatically via trap if any command exits non-zero.
            rollback() {
              echo ""
              echo "!!! DEPLOYMENT FAILED — rolling back to $ROLLBACK_COMMIT !!!"
              git reset --hard "$ROLLBACK_COMMIT"
              chown -R www-data:www-data /var/www/scholr
              sudo -u www-data venv/bin/pip install -r requirements.txt --quiet
              sudo -u www-data venv/bin/python manage.py collectstatic --noinput 2>/dev/null || true
              systemctl restart gunicorn celery celerybeat
              echo "Rollback complete. Server restored to $ROLLBACK_COMMIT"
            }
            trap rollback ERR

            # ── Pull latest code ───────────────────────────────────────────
            # Git runs as root: www-data has no GitHub key of its own.
            echo ""
            echo "=== [1/6] Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Deploying: $NEW_COMMIT"

            # ── Hand everything back to www-data ───────────────────────────
            # Without this, gunicorn cannot write logs or media.
            echo ""
            echo "=== [2/6] Fixing ownership ==="
            chown -R www-data:www-data /var/www/scholr

            # ── Install/update dependencies ────────────────────────────────
            echo ""
            echo "=== [3/6] Installing dependencies ==="
            sudo -u www-data venv/bin/pip install -r requirements.txt --quiet

            # ── Run migrations only if pending ────────────────────────────
            echo ""
            echo "=== [4/6] Database migrations ==="
            if [ "$SKIP_MIGRATIONS" = "true" ]; then
              echo "Skipping migrations by request."
            elif sudo -u www-data venv/bin/python manage.py migrate --check --noinput; then
              echo "No pending migrations."
            else
              echo "Applying pending migrations..."
              sudo -u www-data venv/bin/python manage.py migrate --noinput
            fi

            # ── Collect static files ───────────────────────────────────────
            echo ""
            echo "=== [5/6] Collecting static files ==="
            sudo -u www-data venv/bin/python manage.py collectstatic --noinput

            # ── Restart services ───────────────────────────────────────────
            echo ""
            echo "=== [6/6] Restarting services ==="
            systemctl reload gunicorn
            systemctl restart celery celerybeat
            systemctl reload nginx
            echo "Services reloaded."

            # ── Post-deploy health check ───────────────────────────────────
            # Hits the app on 127.0.0.1 with the right Host header, so this
            # bypasses Cloudflare entirely. Non-2xx/3xx triggers rollback.
            echo ""
            echo "=== Health check ==="
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Host: $DEPLOY_DOMAIN" \
              http://127.0.0.1/)

            if [ "$HTTP_CODE" != "200" ] && \
               [ "$HTTP_CODE" != "301" ] && \
               [ "$HTTP_CODE" != "302" ]; then
              echo "Health check returned HTTP $HTTP_CODE — triggering rollback."
              exit 1
            fi

            # ── Deploy log, read back with: tail logs/deployments.jsonl ─────
            printf '{"at":"%s","target":"%s","from":"%s","to":"%s","result":"ok"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$DEPLOY_TARGET" \
              "$ROLLBACK_COMMIT" "$NEW_COMMIT" \
              >> logs/deployments.jsonl || true

            echo ""
            echo "============================================"
            echo " DEPLOYMENT SUCCESSFUL"
            echo " Target : $DEPLOY_TARGET"
            echo " Commit : $NEW_COMMIT"
            echo " Health : HTTP $HTTP_CODE"
            echo " URL    : https://$DEPLOY_DOMAIN"
            echo "============================================"
        env:
          SKIP_MIGRATIONS: ${{ github.event.inputs.skip_migrations || 'false' }}
          DEPLOY_DOMAIN: ${{ matrix.target == 'judea' && 'judea.uorivo.com' || 'metp.uorivo.com' }}
          DEPLOY_TARGET: ${{ matrix.target }}
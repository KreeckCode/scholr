name: Judea Harvest CI/CD Pipeline

# Trigger on push to main branch or pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Environment variables
env:
  PYTHON_VERSION: 3.12

jobs:
  # Test Job - runs on all pushes and PRs
  test:
    name: Run Tests and Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django system checks
      run: |
        python manage.py check --deploy
      env:
        SECRET_KEY: test-secret-key-for-github-actions-ci-pipeline-very-long
        DEBUG: False
        ALLOWED_HOSTS: localhost,127.0.0.1
        DATABASE_URL: postgresql://test:test@localhost:5432/test
        REDIS_URL: redis://localhost:6379
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        MOODLE_URL: https://test.example.com
        MOODLE_WS_TOKEN: test_token
        PAYSTACK_PUBLIC_KEY: pk_test_xxx
        PAYSTACK_SECRET_KEY: sk_test_xxx
        SESSION_COOKIE_SECURE: False
        CSRF_COOKIE_SECURE: False
        SECURE_SSL_REDIRECT: False
        EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    
    - name: Run Django Tests
      run: |
        python manage.py test --verbosity=2
      env:
        SECRET_KEY: test-secret-key-for-github-actions-ci-pipeline-very-long
        DEBUG: False
        ALLOWED_HOSTS: localhost,127.0.0.1
        DATABASE_URL: postgresql://test:test@localhost:5432/test
        REDIS_URL: redis://localhost:6379
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        MOODLE_URL: https://test.example.com
        MOODLE_WS_TOKEN: test_token
        PAYSTACK_PUBLIC_KEY: pk_test_xxx
        PAYSTACK_SECRET_KEY: sk_test_xxx
        SESSION_COOKIE_SECURE: False
        CSRF_COOKIE_SECURE: False
        SECURE_SSL_REDIRECT: False
        EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend

  # Deploy Job - only runs on successful push to main
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH Agent
      run: |
        eval $(ssh-agent -s)
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-add ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to Production
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
          cd /var/www/judeaharvest &&
          
          # Pull latest code
          sudo -u www-data git pull origin main &&
          
          # Activate virtual environment and install dependencies
          source /var/www/judeaharvest/venv/bin/activate &&
          pip install -r requirements.txt &&
          
          # Run Django migrations
          python manage.py migrate --noinput &&
          
          # Collect static files
          python manage.py collectstatic --noinput --clear &&
          
          # Restart services
          sudo systemctl restart gunicorn &&
          sudo systemctl restart celery &&
          sudo systemctl restart celery-beat &&
          sudo systemctl reload nginx &&
          
          # Health check
          sleep 5 &&
          curl -f http://localhost/ || exit 1
        '
    
    - name: Deployment Status
      if: always()
      run: |
        if [ ${{ job.status }} = "success" ]; then
          echo "✅ Judea Harvest deployment successful!"
        else
          echo "❌ Judea Harvest deployment failed!"
          exit 1
        fi

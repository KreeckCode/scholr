name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  # ==================== TESTING & QUALITY ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django system checks
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: False
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          MOODLE_URL: http://localhost/moodle
          MOODLE_WS_TOKEN: test-token
        run: |
          python manage.py check --deploy
      
      - name: Run Django tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: False
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          MOODLE_URL: http://localhost/moodle
          MOODLE_WS_TOKEN: test-token
        run: |
          python manage.py test
      
      - name: Check for missing migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          python manage.py makemigrations --check --dry-run --no-input

  # ==================== SECURITY SCANNING ====================
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install safety bandit
      
      - name: Check for vulnerable dependencies
        run: |
          pip install -r requirements.txt
          safety check --json || true
      
      - name: Run Bandit security scanner
        run: |
          bandit -r . -f json -o bandit-report.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ==================== CODE QUALITY ====================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install flake8
        run: pip install flake8
      
      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ==================== BUILD STATIC ASSETS ====================
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    needs: [test, security, quality]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Collect static files
        env:
          SECRET_KEY: build-secret-key
          DEBUG: False
          DATABASE_URL: sqlite:///db.sqlite3
        run: |
          python manage.py collectstatic --no-input --clear

  # ==================== DEPLOYMENT ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security, quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: http://165.232.37.122
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment marker
        run: |
          echo "DEPLOYMENT_ID=$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          echo "DEPLOYMENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
      
      # Backup database before deployment
      - name: Backup database
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            BACKUP_DIR="/var/backups/judeaharvest"
            BACKUP_FILE="judeaharvest_$(date +%Y%m%d_%H%M%S).sql"
            
            echo "Creating backup directory..."
            sudo mkdir -p $BACKUP_DIR
            
            echo "Backing up database..."
            PGPASSWORD='${{ secrets.DB_PASSWORD }}' pg_dump \
              -U admin \
              -h localhost \
              -d judeaharvest \
              -F c \
              -f $BACKUP_DIR/$BACKUP_FILE
            
            echo "Backup created: $BACKUP_FILE"
            
            # Keep only last 7 backups
            cd $BACKUP_DIR
            ls -t | tail -n +8 | xargs -r rm
          ENDSSH
      
      # Deploy application
      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            
            echo "=== Starting Deployment ==="
            cd /var/www/judeaharvest
            
            # Pull latest code
            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            
            # Activate virtual environment
            source venv/bin/activate
            
            # Install/update dependencies
            echo "Installing dependencies..."
            pip install -r requirements.txt --quiet
            
            # Run migrations
            echo "Running migrations..."
            python manage.py migrate --no-input
            
            # Collect static files
            echo "Collecting static files..."
            python manage.py collectstatic --no-input --clear
            
            # Check for issues
            echo "Running Django checks..."
            python manage.py check --deploy
            
            echo "=== Deployment Complete ==="
          ENDSSH
      
      # Restart services
      - name: Restart services
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            
            echo "Restarting services..."
            sudo systemctl restart gunicorn
            sudo systemctl restart celery
            sudo systemctl restart celery-beat
            sudo systemctl reload nginx
            
            echo "Waiting for services to stabilize..."
            sleep 5
            
            # Verify services are running
            echo "Checking service status..."
            sudo systemctl is-active gunicorn
            sudo systemctl is-active celery
            sudo systemctl is-active celery-beat
            sudo systemctl is-active nginx
          ENDSSH
      
      # Health check
      - name: Health check
        run: |
          echo "Running health checks..."
          
          # Wait for application to start
          sleep 10
          
          # Check HTTP endpoints
          HEALTH_URL="http://${{ secrets.DEPLOY_HOST }}"
          
          echo "Checking homepage..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
          
          if [ $HTTP_CODE -eq 200 ] || [ $HTTP_CODE -eq 302 ]; then
            echo "✓ Homepage is accessible (HTTP $HTTP_CODE)"
          else
            echo "✗ Homepage health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          echo "Checking admin panel..."
          ADMIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL/admin/)
          
          if [ $ADMIN_CODE -eq 200 ] || [ $ADMIN_CODE -eq 302 ]; then
            echo "✓ Admin panel is accessible (HTTP $ADMIN_CODE)"
          else
            echo "✗ Admin panel health check failed (HTTP $ADMIN_CODE)"
            exit 1
          fi
          
          echo "=== All health checks passed ==="
      
      # Log deployment
      - name: Log deployment
        if: always()
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            echo "[${{ env.DEPLOYMENT_TIME }}] Deployment ${{ env.DEPLOYMENT_ID }} - Status: ${{ job.status }}" >> /var/www/judeaharvest/logs/deployments.log
          ENDSSH
      
      # Rollback on failure
      - name: Rollback on failure
        if: failure()
        run: |
          echo "=== DEPLOYMENT FAILED - INITIATING ROLLBACK ==="
          
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd /var/www/judeaharvest
            
            echo "Reverting to previous commit..."
            git reset --hard HEAD~1
            
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --no-input
            python manage.py collectstatic --no-input --clear
            
            sudo systemctl restart gunicorn celery celery-beat
            sudo systemctl reload nginx
            
            echo "=== Rollback complete ==="
          ENDSSH
          
          exit 1

  # ==================== POST-DEPLOYMENT ====================
  post-deploy:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    
    steps:
      - name: Clear Django cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/judeaharvest
            source venv/bin/activate
            python manage.py shell << 'EOF'
            from django.core.cache import cache
            cache.clear()
            print("Cache cleared successfully")
            EOF
      
      - name: Warm up cache
        run: |
          echo "Warming up application cache..."
          curl -s http://${{ secrets.DEPLOY_HOST }}/ > /dev/null
          curl -s http://${{ secrets.DEPLOY_HOST }}/admin/ > /dev/null
          echo "Cache warmed up"
      
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://${{ secrets.DEPLOY_HOST }}" >> $GITHUB_STEP_SUMMARY